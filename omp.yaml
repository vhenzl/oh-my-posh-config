# yaml-language-server: $schema=https://raw.githubusercontent.com/JanDeDobbeleer/oh-my-posh/main/themes/schema.json

palette:
  black: "#262B44"
  blue: "#4B95E9"
  green: "#59C9A5"
  orange: "#F07623"
  red: "#D81E5B"
  white: "#E0DEF4"
  yellow: "#F3AE35"
  purple: "#49416D"
  pink: "#7A306C"
secondary_prompt:
  foreground: p:black
  background: transparent
  template: "{{ if .Root }}<p:orange> </>{{end}} ❯"
transient_prompt:
  foreground: p:black
  background: transparent
  template: "<p:black,transparent></><#8d8b99,p:black> {{ .Folder }} </><p:black,transparent></> "
upgrade:
  source: cdn
  interval: 168h
  auto: false
  notice: false
console_title_template: "{{ .Shell }} in {{ .Folder }}"
blocks:
  - type: prompt
    alignment: left
    segments:
      - type: session
        style: diamond
        leading_diamond: 
        trailing_diamond: 
        foreground: p:black
        background: p:white
        template: " {{ if .SSHSession }} {{ end }}{{ .UserName }} "
      - type: path
        options:
          style: full
          gitdir_format: '<p:blue><b>%s</b></>'
        style: powerline
        powerline_symbol: 
        foreground: p:white
        background: p:black
        template: ' {{ path "" .Location }} {{ .Path }} '
      - type: git
        options:
          branch_template: "{{ trunc 25 .Branch }}"
          fetch_status: true
          fetch_upstream_icon: true
        style: powerline
        powerline_symbol: 
        foreground: p:black
        background: p:green
        foreground_templates:
          - "{{ if or (.Working.Changed) (.Staging.Changed) }}p:black{{ end }}"
          - "{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:white{{ end }}"
          - "{{ if gt .Ahead 0 }}p:white{{ end }}"
        background_templates:
          - "{{ if or (.Working.Changed) (.Staging.Changed) }}p:yellow{{ end }}"
          - "{{ if and (gt .Ahead 0) (gt .Behind 0) }}p:red{{ end }}"
          - "{{ if gt .Ahead 0 }}p:purple{{ end }}"
          - "{{ if gt .Behind 0 }}p:pink{{ end }}"
        template: >-
          {{ " " }}{{ .UpstreamIcon }} {{ .HEAD }}{{ " " }}
          {{- if .BranchStatus }}{{ .BranchStatus }} {{ end }}
          {{- if .Working.Changed }} {{ .Working.String }} {{ end }}
          {{- if and (.Working.Changed) (.Staging.Changed) }}| {{ end }}
          {{- if .Staging.Changed }} {{ .Staging.String }} {{ end }}
        #{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }}

  - type: prompt
    alignment: right
    newline: false
    overflow: break
    segments:
      - type: project
        style: powerline
        powerline_symbol: 
        foreground: transparent
        background: p:blue
        template: " {{ .Name }} "
      - type: node
        options:
          fetch_package_manager: true
        style: plain
        foreground: "#6CA35E"
        background: transparent
        template: "  {{ .Full }}{{ if .PackageManagerName }} {{ .PackageManagerName }}{{ end }}"
      - type: dotnet
        style: plain
        foreground: "#512BD4"
        background: transparent
        template: "  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}"
      - type: php
        style: plain
        foreground: "#4063D8"
        background: transparent
        template: "  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}"
      - type: go
        style: plain
        foreground: "#7FD5EA"
        background: transparent
        template: "  {{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}"
      - type: python
        style: plain
        foreground: "#ffd43b"
        background: transparent
        template: "  {{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}"

  - type: prompt
    alignment: left
    newline: true
    segments:
      - type: root
        style: plain
        background: transparent
        foreground: p:orange
        template: " "
      - type: status
        options:
          always_enabled: true
        style: plain
        foreground: p:yellow
        background: transparent
        foreground_templates:
          - "{{ if gt .Code 0 }}p:red{{ end }}"
        # template: ' {{ if gt .Code 0 }}{{ else }}{{ end }} '
        template: " ❯"

  - type: rprompt
    segments:
      - type: executiontime
        options:
          style: austin
          always_enabled: true
        style: plain
        foreground: p:yellow
        background: transparent
        foreground_templates:
          - "{{ if .Segments.Status.Error }}p:red{{ end }}"
        template: "{{ .FormattedMs }}"
      - style: plain
        type: time
        foreground: p:yellow
        background: transparent
        foreground_templates:
          - "{{ if .Segments.Status.Error }}p:red{{ end }}"
        template: ' <p:black>@</> {{ .CurrentDate | date "15:04:05" }}'

tooltips:
  - options:
      display_default: true
    leading_diamond: 
    trailing_diamond: 
    template: "  {{ .Profile }}{{ if .Region }}@{{ .Region }}{{ end }} "
    foreground: p:white
    background: p:orange
    type: aws
    style: diamond
    tips:
      - aws
  - options:
      display_default: true
    leading_diamond: 
    trailing_diamond: 
    template: "  {{ .Name }} "
    foreground: p:white
    background: p:blue
    type: az
    style: diamond
    tips:
      - az
version: 4
final_space: true
